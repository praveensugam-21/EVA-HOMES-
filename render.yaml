services:
  # Backend Web Service (FastAPI)
  - type: web
    name: eva-homes-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false        # deployed frontend URL, e.g. https://eva-homes-two.vercel.app — no trailing slash
      - key: DATABASE_URL
        sync: false        # Supabase Postgres connection string — set in Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false        # optional — Google Cloud Console OAuth Client ID
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false         # Supabase project URL, e.g. https://xxxx.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false          # Supabase service_role key (secret — never the anon key)
      - key: SUPABASE_BUCKET_IMAGES
        value: property-images
      - key: SUPABASE_BUCKET_DOCS
        value: seller-documents
