services:
  # Backend Web Service (FastAPI)
  - type: web
    name: eva-homes-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false        # Supabase Postgres connection string — set in Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false        # optional — Google Cloud Console OAuth Client ID
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false         # Supabase project URL, e.g. https://xxxx.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false          # Supabase service_role key (secret — never the anon key)
      - key: SUPABASE_BUCKET_IMAGES
        value: property-images
      - key: SUPABASE_BUCKET_DOCS
        value: seller-documents
      - key: CRON_SECRET
        generateValue: true    # shared-secret header the cron job below authenticates with

  # Cron Job — fires the "1 hour before a visit" reminder every 10 minutes.
  # Render free web services spin down when idle, so an in-process scheduler
  # would silently stop firing; this wakes on its own schedule instead.
  - type: cron
    name: eva-homes-visit-reminders
    env: python
    region: singapore
    plan: free
    rootDir: backend
    schedule: "*/10 * * * *"
    buildCommand: "true"
    startCommand: >
      python -c "
      import os, urllib.request;
      req = urllib.request.Request(
          'https://eva-homes-backend.onrender.com/api/visits/dispatch-reminders',
          method='POST',
          headers={'X-Cron-Secret': os.environ['CRON_SECRET']},
      );
      urllib.request.urlopen(req)
      "
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: eva-homes-backend
          envVarKey: CRON_SECRET
